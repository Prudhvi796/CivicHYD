<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | CivicHYD</title>

    <link rel="stylesheet" href="style.css">

    <style>

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f7fb;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .login-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-logo h1 {
            margin: 0;
            color: #123c69;
            font-size: 32px;
        }

        .login-logo p {
            color: #666;
            margin-top: 8px;
        }

        .login-card h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 13px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #123c69;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        .error-message {
            color: #d93025;
            text-align: center;
            margin-top: 15px;
            display: none;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #123c69;
            text-decoration: none;
        }

    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="login-logo">
                <h1>CivicHYD</h1>
                <p>Hyderabad Civic Services</p>
            </div>

            <h2>Admin Login</h2>

            <form id="adminLoginForm">

                <div class="form-group">
                    <label>Username</label>

                    <input
                        type="text"
                        id="adminUsername"
                        placeholder="Enter username"
                        required
                    >
                </div>


                <div class="form-group">
                    <label>Password</label>

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Enter password"
                        required
                    >
                </div>


                <button
                    type="submit"
                    class="login-btn"
                >
                    Login
                </button>

                <p
                    class="error-message"
                    id="loginError"
                >
                    Invalid username or password
                </p>

            </form>


            <div class="back-link">

                <a href="index.html">
                    ← Back to Home
                </a>

            </div>

        </div>

    </div>


    <script>

        const loginForm =
            document.getElementById(
                "adminLoginForm"
            );


        loginForm.addEventListener(
            "submit",

            function(event) {

                event.preventDefault();


                const username =
                    document.getElementById(
                        "adminUsername"
                    ).value;


                const password =
                    document.getElementById(
                        "adminPassword"
                    ).value;


                /*
                 College Project Admin Credentials
                */

                const ADMIN_USERNAME =
                    "admin";


                const ADMIN_PASSWORD =
                    "civichyd123";


                if (

                    username ===
                    ADMIN_USERNAME

                    &&

                    password ===
                    ADMIN_PASSWORD

                ) {

                    localStorage.setItem(
                        "adminLoggedIn",
                        "true"
                    );


                    window.location.href =
                        "admin-dashboard.html";

                }

                else {

                    document.getElementById(
                        "loginError"
                    ).style.display =
                        "block";

                }

            }

        );

    </script>

</body>
</html>
